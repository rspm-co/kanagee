<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="theme-color" content="#fffaf0"/>
  <title>KANAGEE — Countdown</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#922420;font-family:Arial,sans-serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;padding:40px 20px}.logo{display:block;width:clamp(145px,20vw,220px);height:auto}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,4vw,36px);width:min(100%,660px);text-align:center}.timer strong{display:block;font-size:clamp(35px,9vw,76px);line-height:1.1;letter-spacing:-2px;font-weight:600;font-variant-numeric:tabular-nums}.timer span{display:block;font-size:clamp(8px,1.5vw,11px);letter-spacing:2px;margin-top:13px;color:#83664e}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#event-status{font-size:16px;text-align:center;margin:0}#event-status:empty{display:none}@media(max-width:420px){main{gap:34px}.timer strong{letter-spacing:-1px}.timer span{letter-spacing:1px}}
  </style>
  <style>
    .display-controls{position:fixed;right:20px;bottom:16px;left:20px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:#83664e}.display-controls button{min-height:44px;padding:10px 16px;border:1px solid #d9b77c;border-radius:8px;background:#fffdf7;color:#922420;font:inherit;cursor:pointer}.display-controls button:focus-visible{outline:3px solid #922420;outline-offset:3px}.display-controls button[aria-pressed=true]{background:#922420;color:#fffdf7}.display-controls button:disabled{cursor:default;opacity:.65}.display-controls p{margin:0;max-width:460px;line-height:1.5}main{padding-bottom:110px}@media(max-height:500px){main{gap:20px}.logo{width:110px}.display-controls{font-size:11px;bottom:8px}}
  </style>
</head>
<body>
  <main data-event-start="2026-12-03T12:00:00+05:30">
    <h1 class="sr-only">KANAGEE event countdown</h1>
    <img class="logo" src="/kanagee-logo-transparent-256w.webp" width="256" height="277" alt="KANAGEE" fetchpriority="high"/>
    <div class="timer" role="timer" aria-label="Time until KANAGEE opens on 3 December 2026 at 12 PM India Standard Time" aria-live="off">
      <div><strong id="days">00</strong><span>DAYS</span></div>
      <div><strong id="hours">00</strong><span>HOURS</span></div>
      <div><strong id="minutes">00</strong><span>MINUTES</span></div>
      <div><strong id="seconds">00</strong><span>SECONDS</span></div>
    </div>
    <p id="event-status" role="status"></p>
    <noscript>Enable JavaScript to see the countdown to 3 December 2026, 12 PM IST.</noscript>
  </main>
  <aside class="display-controls" aria-label="Office display controls">
    <button id="keep-awake" type="button" aria-pressed="false">Keep screen awake</button>
    <p id="awake-status" role="status">Checking screen-awake support…</p>
  </aside>
  <script type="module">
    import {setupKeepAwake} from './keep-awake.js';
    setupKeepAwake({document,navigator,button:document.getElementById('keep-awake'),status:document.getElementById('awake-status')});
  </script>
  <script>
    const startsAt=Date.parse(document.querySelector('main').dataset.eventStart);
    const fields=['days','hours','minutes','seconds'].map(id=>document.getElementById(id));
    let interval;
    function update(){
      const remaining=Math.max(0,Math.ceil((startsAt-Date.now())/1000));
      const values=[Math.floor(remaining/86400),Math.floor(remaining/3600)%24,Math.floor(remaining/60)%60,remaining%60];
      fields.forEach((field,index)=>{field.textContent=String(values[index]).padStart(2,'0')});
      if(remaining===0){document.getElementById('event-status').textContent='The countdown is complete.';if(interval)clearInterval(interval)}
    }
    update();
    if(Date.now()<startsAt)interval=setInterval(update,1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
  </script>
</body>
</html>
